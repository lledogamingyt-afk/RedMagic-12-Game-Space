name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip app folder and fix build/imports
        run: |
          if [ -f "app.zip" ]; then
            unzip -o app.zip
          fi
          cat << 'EOF' >> app/build.gradle

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          python3 -c '
          import glob
          imports = "\nimport android.app.ActivityManager\nimport android.content.IntentFilter\nimport android.media.projection.MediaProjection\nimport android.media.projection.MediaProjectionManager\n"
          for path in glob.glob("app/src/main/java/**/*.kt", recursive=True):
              with open(path, "r") as f:
                  content = f.read()
              lines = content.splitlines()
              if lines and lines[0].startswith("package "):
                  lines.insert(1, imports)
                  with open(path, "w") as f:
                      f.write("\n".join(lines))
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
